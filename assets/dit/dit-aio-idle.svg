<svg viewBox="-16 -4 232 226" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><style>
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(54px)}}
@keyframes blink{0%,40%,55%,100%{opacity:1}47%{opacity:.25}}
@keyframes beam{0%,100%{opacity:.12}50%{opacity:.4}}
@keyframes mark{0%{transform:scaleX(0)}60%,85%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
@keyframes ear{0%,100%{transform:scale(1)}50%{transform:scale(1.45)}}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-7px)}}
@keyframes idle{0%,82%,100%{opacity:1}86%,96%{opacity:0}}
@keyframes sweep{0%,82%,100%{opacity:0}86%,96%{opacity:1}}
.dit-scan{animation:scan 1.4s ease-in-out infinite alternate}
.dit-ant{animation:blink 1.8s infinite}
.dit-beam{animation:beam 1.4s ease-in-out infinite}
.dit-hl{transform-box:fill-box;transform-origin:left center;animation:mark 2.8s ease-out infinite}
.dit-ear{transform-box:fill-box;transform-origin:center}
.is-listening .dit-ear{animation:ear 1s ease-in-out infinite}
.is-done{animation:hop 1.3s ease-in-out infinite}
.dit-eyes{animation:idle 6s infinite}.dit-sweep{animation:sweep 6s infinite}.dit-sweep .dit-scan{animation:scan .6s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.dit-sweep{opacity:0}}
</style><g class=""><ellipse cx="100" cy="214" rx="44" ry="6" fill="rgba(20,25,43,.14)"/><rect x="74" y="178" width="18" height="30" rx="9" fill="#DCE3FF" stroke="#14192B" stroke-width="4"/><rect x="108" y="178" width="18" height="30" rx="9" fill="#DCE3FF" stroke="#14192B" stroke-width="4"/><rect x="70" y="134" width="72" height="56" rx="22" fill="#2340FF"/><g stroke="#14192B" stroke-width="4" stroke-linecap="round"><line x1="68" y1="150" x2="46" y2="172"/><line x1="132" y1="150" x2="154" y2="172"/></g><circle cx="44" cy="175" r="8" fill="#FFFFFF" stroke="#14192B" stroke-width="4"/><circle cx="156" cy="175" r="8" fill="#FFFFFF" stroke="#14192B" stroke-width="4"/><rect x="64" y="128" width="72" height="56" rx="22" fill="#FFFFFF" stroke="#14192B" stroke-width="4"/><rect x="78" y="151" width="44" height="12" rx="6" fill="#14192B"/><rect x="81" y="154" width="28" height="6" rx="3" fill="#C6F432"/><line x1="80" y1="48" x2="70" y2="26" stroke="#14192B" stroke-width="4" stroke-linecap="round"/><circle class="dit-ant" cx="68" cy="20" r="7" fill="#C6F432" stroke="#14192B" stroke-width="4"/><rect x="32" y="48" width="148" height="94" rx="47" fill="#2340FF"/><rect x="26" y="42" width="148" height="94" rx="47" fill="#FFFFFF" stroke="#14192B" stroke-width="4"/><rect x="44" y="64" width="112" height="48" rx="24" fill="#14192B"/><rect x="138" y="70" width="6" height="14" rx="3" fill="#fff" opacity=".22" transform="rotate(25 141 77)"/><g class="dit-eyes"><rect x="73" y="76" width="11" height="24" rx="5.5" fill="#C6F432"/><rect x="116" y="76" width="11" height="24" rx="5.5" fill="#C6F432"/></g><g class="dit-sweep" opacity="0"><rect x="58" y="86" width="84" height="4" rx="2" fill="#C6F432" opacity=".35"/><rect class="dit-scan" x="58" y="83" width="30" height="10" rx="5" fill="#C6F432"/></g><circle cx="26" cy="89" r="17" fill="#DCE3FF" stroke="#14192B" stroke-width="4"/><circle class="dit-ear" cx="26" cy="89" r="6" fill="#C6F432"/><circle cx="174" cy="89" r="17" fill="#DCE3FF" stroke="#14192B" stroke-width="4"/><circle class="dit-ear" cx="174" cy="89" r="6" fill="#C6F432"/></g></svg>